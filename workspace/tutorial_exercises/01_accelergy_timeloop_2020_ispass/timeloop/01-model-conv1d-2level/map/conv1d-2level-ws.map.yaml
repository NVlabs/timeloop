mapping:
  # 主存储器层映射 - 负责时间维度的卷积核遍历
  - target: MainMemory
    type: temporal
    factors: R=3 P=1        # R维度完全展开(3个权重)，P维度不分块(1)
    permutation: RP         # 外层循环R，内层循环P
    # 效果: 3个时间步，每步处理1个权重与所有输出位置
    
  # 缓存层映射 - 负责空间维度的并行计算  
  - target: Buffer
    type: temporal
    factors: R=1 P=16       # R维度不分块(1)，P维度完全展开(16个输出)
    permutation: PR         # 外层循环P，内层循环R
    # 效果: 16个并行计算单元，每个处理1个输出位置
    
# Weight Stationary 映射的核心特征:
# 1. 权重复用: 每个权重值被复用16次(P=16)
# 2. 输出累加: 所有输出位置需要保持用于累加
# 3. 输入滑动: 输入窗口逐步滑动([0:16) → [1:17) → [2:18))
# 4. 存储代价: 需要大容量输出缓存来存储完整输出向量
    
